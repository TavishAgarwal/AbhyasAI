<div class="adhd-content">
  <h1>Session Report: {{topicContext}}</h1>
  
  <div class="box summary">
    <h2>Overall Summary</h2>
    <p>{{summary}}</p>
    <p><strong>Score:</strong> {{overall_score}} / 1.0</p>
  </div>

  <h2>Skill Progression</h2>
  <div class="skills-grid">
    {{skillProgressionHTML}}
  </div>

  <h2>Top Strengths</h2>
  <div class="cards strengths">
    {{strengthsHTML}}
  </div>

  <h2>Areas for Improvement</h2>
  <div class="cards gaps">
    {{gapsHTML}}
  </div>

  <h2>Try This Next</h2>
  <div class="cards recommendations">
    {{recommendationsHTML}}
  </div>
</div>

<style>
  .adhd-content {
    font-family: 'Arial', sans-serif;
    color: #1A1A2E;
    max-width: 700px;
    margin: 0 auto;
  }
  h1, h2 {
    padding: 12px 0;
    margin-top: 24px;
    margin-bottom: 16px;
    font-weight: 800; /* Clear, bold headings */
  }
  .box {
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .box.summary {
    background: #E8F4FD;
    border-left: 6px solid #1B5E8B;
  }
  
  .skills-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .skill-card {
    background: #f1f5f9;
    padding: 16px;
    border-radius: 8px;
    text-align: center;
    border: 2px solid #e2e8f0;
  }
  .skill-card .name { font-weight: bold; margin-bottom: 8px; display: block; }
  .skill-card .rating { font-size: 1.2rem; color: #475569; }
  .skill-card .delta.positive { color: #16a34a; font-weight: bold; }
  .skill-card .delta.negative { color: #dc2626; font-weight: bold; }

  .cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }
  .card {
    padding: 16px;
    border-radius: 8px;
  }
  .card.strength {
    background: #EAF5EA;
    border-left: 6px solid #1E7E34;
  }
  .card.gap {
    background: #FEF5EC;
    border-left: 6px solid #E67E22;
  }
  .card.action {
    background: #F3E8FD;
    border-left: 6px solid #7B2FBE;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .checkbox {
    width: 20px;
    height: 20px;
    border: 2px solid #7B2FBE;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 2px;
    background: white;
  }
  
  /* Details/summary for progressive disclosure */
  details {
    cursor: pointer;
  }
  summary {
    font-weight: bold;
    outline: none;
    list-style: none; /* Hide default arrow in some browsers */
  }
  summary::-webkit-details-marker {
    display: none;
  }
  summary::before {
    content: "▶ ";
    display: inline-block;
    transition: transform 0.2s;
    font-size: 0.8em;
  }
  details[open] summary::before {
    transform: rotate(90deg);
  }
  details p {
    margin-top: 12px;
    margin-bottom: 0;
  }
</style>
