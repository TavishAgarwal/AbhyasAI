services:
  # ------------------------------------------------------------
  # Redis Instance (Used for BullMQ)
  # ------------------------------------------------------------
  - type: redis
    name: abhyas-ai-redis
    ipAllowList: [] # Blank means only internal Render services can connect
    plan: free

  # ------------------------------------------------------------
  # Main Backend API
  # ------------------------------------------------------------
  - type: web
    name: abhyas-ai-api
    env: node
    region: oregon # Change to your preferred region (e.g., frankfurt, ohio, singapore)
    plan: free
    rootDir: backend
    buildCommand: "npm ci"
    startCommand: "npm start"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: abhyas-ai-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WORKER_API_URL
        sync: false

  # ------------------------------------------------------------
  # Background Worker (PDF Generation & WhatsApp)
  # ------------------------------------------------------------
  - type: worker
    name: abhyas-ai-worker
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "npm ci"
    startCommand: "node worker.js"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: abhyas-ai-redis
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: API_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WORKER_API_URL
        sync: false
